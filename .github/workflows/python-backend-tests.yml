name: Backend Tests

on:
  push:
    branches: [ "main", "master" ]
  # Run on all pull requests (targeting any branch)
  pull_request: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: game_recs
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d game_recs"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        working-directory: apps/api
        run: |
          python -m pip install ruff
          ruff check .

      - name: Run Alembic migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/game_recs
        run: |
          alembic upgrade head

      # Optional: seed the database for integration smoke testing. Disabled by default;
      # uncomment the next step if you want CI to run the seed script as part of the job.
      # - name: Seed database
      #   working-directory: apps/api
      #   env:
      #     DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/game_recs
      #   run: |
      #     python scripts/seed.py

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/game_recs
        run: |
          pytest -q

  build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api image
        working-directory: .
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-api:latest -f apps/api/Dockerfile apps/api
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-api:latest

  integration-smoke:
    needs: test-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: game_recs
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        options: >-
          --health-cmd="pg_isready -U app -d game_recs"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Alembic migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/game_recs
        run: |
          alembic upgrade head

      - name: Start API server in background
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/game_recs
        run: |
          # run uvicorn and redirect stdout/stderr to a logfile, then stream the logfile
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info > server.log 2>&1 &
          # stream server logs so GitHub Actions captures startup logs (including model autodetection)
          tail -n +1 -f server.log &
          # wait for server to be ready by polling /health
          echo "Waiting for API to become healthy..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
            echo "API did not become healthy in time" >&2
            cat server.log || true
            exit 1
          fi

      - name: Seed DB
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/game_recs
        run: |
          python scripts/seed.py

      - name: Run smoke test
        working-directory: .
        run: |
          python scripts/smoke_test.py
