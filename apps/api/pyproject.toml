[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coop-game-recs-api"
version = "0.1.0"
description = "FastAPI backend for cooperative game recommendations"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "fastapi>=0.115.0",
    "passlib>=1.7.4",
    "pgvector>=0.3.6",
    "requests>=2.28.0",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.32.0",
    "daytime>=0.4",
    "httpx>=0.27.2",
    "email-validator>=2.2.0",
    "tenacity>=8.5.0",
    "numpy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "ruff>=0.7.0"
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "scripts*", "tests*"]

